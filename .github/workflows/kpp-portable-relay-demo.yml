name: KPP Portable Relay - Live Two-Way Demo
on:
  push:
    branches:
      - kpp-portable-relay-live-demo-20261110
    paths:
      - .github/workflows/kpp-portable-relay-demo.yml
      - experiments/portable_relay_live/**
permissions:
  contents: read
jobs:
  external-computation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Execute KPP protocol calculator on external runner
        run: python3 experiments/portable_relay_live/worker.py
